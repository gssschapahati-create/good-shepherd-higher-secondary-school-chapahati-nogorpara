<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Quiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;}
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 700px; text-align: center; }
        h1 { color: #2c3e50; }
        input[type="text"] { padding: 10px; width: 80%; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        #timer { font-size: 24px; font-weight: bold; color: #e74c3c; margin-bottom: 20px; }
        #question { font-size: 20px; margin-bottom: 20px; font-weight: 500; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn, .start-btn { padding: 12px; font-size: 16px; border: 2px solid #3498db; background: white; color: #3498db; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .start-btn { background: #3498db; color: white; }
        .option-btn:hover:not(:disabled) { background: #3498db; color: white; }
        .option-btn:disabled { cursor: not-allowed; }
        .correct { background: #2ecc71 !important; color: white !important; border-color: #2ecc71 !important; }
        .wrong { background: #e74c3c !important; color: white !important; border-color: #e74c3c !important; }
        #quiz-container, #result-container { display: none; }
        
        /* Marksheet specific styles for perfect PDF generation */
        #marksheet { text-align: left; margin-bottom: 20px; padding: 30px; border: 1px solid #ddd; background: white;}
        .qa-block { 
            page-break-inside: avoid; /* Prevents questions from splitting across pages in PDF */
            margin-bottom: 15px; 
            padding: 15px; 
            background: #f9f9f9; 
            border-radius: 8px;
            border-left: 5px solid #ccc;
        }
        .correct-block { border-left-color: #2ecc71; }
        .wrong-block { border-left-color: #e74c3c; }
        .download-btn { padding: 12px 24px; background: #2ecc71; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<!-- Start Screen -->
<div class="container" id="start-container">
    <h1>Good Shepherd Hr. Sec. School Chapahati - Nogorpara</h1>
    <h1>Science Quiz</h1>
    <p>Please enter your Club Name to begin.</p>
    <input type="text" id="student-name" placeholder="Your Club Name" required>
    <br>
    <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
</div>

<!-- Quiz Screen -->
<div class="container" id="quiz-container">
    <h1>Science Quiz</h1>
    <div id="quiz-header">Question <span id="q-num">1</span> of 25</div>
    <div id="timer">00:30</div>
    <div id="question">Loading...</div>
    <div class="options" id="options"></div>
</div>

<!-- Results Screen -->
<div class="container" id="result-container" style="max-width: 800px;">
    <div id="saving-msg" style="color: #3498db; font-weight: bold; margin-bottom: 15px;">Saving results to database...</div>
    
    <div id="marksheet">
        <h1 style="text-align:center; margin-top: 0;">Science Quiz - Final Report</h1>
        <h3 style="text-align:center; color: #555;">Student Name: <span id="display-name" style="color: #2c3e50;"></span></h3>
        <h2 style="text-align:center; background: #e8f4f8; padding: 10px; border-radius: 8px;">Total Score: <span id="final-score">0</span> / 25</h2>
        <hr style="margin: 20px 0;">
        <h3 style="text-align: center; color: #333;">Detailed Submission Review</h3>
        <div id="detailed-results"></div>
    </div>
    
    <button class="download-btn" onclick="downloadPDF()">Download Full PDF Report</button>
</div>

<script>
    // ==========================================
    // PASTE YOUR GOOGLE SCRIPT WEB APP URL BELOW
    // ==========================================
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxt4Bhk5Oop5lKgRb8XgOImsIGfMQlQ9i7iIBz1JpyNNpBLtYsNsq7FUP3Df7sai2uo/exec';

    const questions = [
        { q: "What temperature does water boil at (in Celsius)?", options: ["50°C", "90°C", "100°C", "120°C"], a: 2 },
        { q: "Which is the nearest star to Earth?", options: ["Sirius", "Sun", "Alpha Centauri", "Polaris"], a: 1 },
        { q: "What gas do humans breathe in to survive?", options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Helium"], a: 0 },
        { q: "What gas do plants absorb from the air?", options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Hydrogen"], a: 1 },
        { q: "What is the hardest natural substance on Earth?", options: ["Gold", "Iron", "Diamond", "Quartz"], a: 2 },
        { q: "How many planets are in our solar system?", options: ["7", "8", "9", "10"], a: 1 },
        { q: "What is the center of an atom called?", options: ["Proton", "Electron", "Nucleus", "Molecule"], a: 2 },
        { q: "What force keeps us on the ground?", options: ["Magnetism", "Friction", "Gravity", "Tension"], a: 2 },
        { q: "Which planet is closest to the Sun?", options: ["Venus", "Earth", "Mars", "Mercury"], a: 3 },
        { q: "Which is the largest planet in our solar system?", options: ["Saturn", "Jupiter", "Neptune", "Uranus"], a: 1 },
        { q: "What is the chemical formula for water?", options: ["CO2", "H2O", "O2", "NaCl"], a: 1 },
        { q: "What is Earth's only natural satellite?", options: ["Sun", "Moon", "Mars", "Comet"], a: 1 },
        { q: "What is a young frog called?", options: ["Tadpole", "Fry", "Pup", "Nymph"], a: 0 },
        { q: "Which organ pumps blood through the human body?", options: ["Brain", "Lungs", "Liver", "Heart"], a: 3 },
        { q: "Sound travels fastest through which medium?", options: ["Air", "Water", "Vacuum", "Solids"], a: 3 },
        { q: "Which part of a plant conducts photosynthesis?", options: ["Root", "Stem", "Leaf", "Flower"], a: 2 },
        { q: "How many bones are in an adult human body?", options: ["206", "208", "210", "212"], a: 0 },
        { q: "Which planet is known as the Red Planet?", options: ["Jupiter", "Venus", "Mars", "Saturn"], a: 2 },
        { q: "The Sun is a...?", options: ["Planet", "Star", "Comet", "Meteor"], a: 1 },
        { q: "What is the process of a liquid turning into a gas called?", options: ["Condensation", "Freezing", "Melting", "Evaporation"], a: 3 },
        { q: "What is the primary source of energy for Earth?", options: ["Wind", "Volcanoes", "Sun", "Ocean"], a: 2 },
        { q: "An animal that eats only plants is a...?", options: ["Carnivore", "Herbivore", "Omnivore", "Insectivore"], a: 1 },
        { q: "What is the freezing point of water?", options: ["0°C", "10°C", "32°C", "100°C"], a: 0 },
        { q: "How many colors are in a rainbow?", options: ["5", "6", "7", "8"], a: 2 },
        { q: "What is the largest mammal on Earth?", options: ["Elephant", "Giraffe", "Blue Whale", "Shark"], a: 2 }
    ];

    let currentQ = 0, score = 0, timeLeft = 30, timerInterval;
    let userName = "";
    const userAnswers = [];

    function startQuiz() {
        userName = document.getElementById("student-name").value.trim();
        if (userName === "") return alert("Please enter your name.");
        document.getElementById("start-container").style.display = "none";
        document.getElementById("quiz-container").style.display = "block";
        loadQuestion();
    }

    function loadQuestion() {
        timeLeft = 30;
        document.getElementById("timer").innerText = `00:${timeLeft}`;
        document.getElementById("q-num").innerText = currentQ + 1;
        document.getElementById("question").innerText = questions[currentQ].q;
        
        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";
        
        questions[currentQ].options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsDiv.appendChild(btn);
        });

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").innerText = `00:${timeLeft < 10 ? '0'+timeLeft : timeLeft}`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                checkAnswer(-1, null); 
            }
        }, 1000);
    }

    function checkAnswer(selectedIndex, btnNode) {
        clearInterval(timerInterval);
        const correctIndex = questions[currentQ].a;
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach(btn => btn.disabled = true);
        buttons[correctIndex].classList.add("correct");

        let status = "Incorrect";
        if (selectedIndex === correctIndex) {
            score++; status = "Correct";
        } else if (selectedIndex !== -1) {
            btnNode.classList.add("wrong");
        }

        userAnswers.push({
            q: questions[currentQ].q,
            userAns: selectedIndex !== -1 ? questions[currentQ].options[selectedIndex] : "Timeout (No Answer)",
            correctAns: questions[currentQ].options[correctIndex],
            status: status
        });

        setTimeout(nextQuestion, 2000); 
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) loadQuestion();
        else showResults();
    }

    function showResults() {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("result-container").style.display = "block";
        document.getElementById("display-name").innerText = userName;
        document.getElementById("final-score").innerText = score;

        let detailsHTML = "";
        userAnswers.forEach((ans, i) => {
            let isCorrect = ans.status === "Correct";
            let color = isCorrect ? "#27ae60" : "#c0392b";
            let blockClass = isCorrect ? "correct-block" : "wrong-block";
            
            detailsHTML += `
                <div class="qa-block ${blockClass}">
                    <p style="margin: 0 0 8px 0; font-size: 16px;"><b>Q${i+1}: ${ans.q}</b></p>
                    <p style="margin: 4px 0;">Your Answer: <span style="color:${color}; font-weight:bold;">${ans.userAns}</span></p>
                    ${!isCorrect ? `<p style="margin: 4px 0;">Correct Answer: <span style="color:#27ae60; font-weight:bold;">${ans.correctAns}</span></p>` : ''}
                </div>`;
        });
        document.getElementById("detailed-results").innerHTML = detailsHTML;

        // Send Data to Google Sheets
        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify({ name: userName, quizName: "Science Quiz", score: score, answers: userAnswers })
        }).then(() => {
            document.getElementById("saving-msg").innerText = "Results saved to database successfully!";
            document.getElementById("saving-msg").style.color = "green";
        }).catch(err => {
            document.getElementById("saving-msg").innerText = "Network error: Could not save to database.";
            document.getElementById("saving-msg").style.color = "red";
        });
    }

    function downloadPDF() {
        const element = document.getElementById('marksheet');
        const opt = {
            margin:       0.3,
            filename:     userName + '_Science_Report.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>
</body>
</html>
